name: Refresh phishing list

# Daily auto-pull from PhishStats + OpenPhish.
#
# 06:00 UTC = early morning Europe, late night Americas — both feeds
# typically refresh between 03:00-05:00 UTC so we catch the latest data
# without hammering them.
#
# Result: opens a PR with the regenerated
# src/phishing-domains.generated.ts. Merging triggers no auto-deploy
# (verifier deploy is manual via `npx wrangler deploy`) — the PR is the
# review surface.
#
# Manual trigger also wired below (workflow_dispatch).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Refresh phishing list
        run: pnpm refresh-phishing

      - name: Check for changes
        id: check
        run: |
          if [[ -n "$(git status --porcelain src/phishing-domains.generated.ts)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Count how many entries changed for the PR body
            ADDED=$(git diff src/phishing-domains.generated.ts | grep -c '^+  "' || true)
            REMOVED=$(git diff src/phishing-domains.generated.ts | grep -c '^-  "' || true)
            echo "added=$ADDED" >> "$GITHUB_OUTPUT"
            echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: phishing-refresh/auto
          delete-branch: true
          commit-message: |
            Auto-refresh phishing domain list

            Added ${{ steps.check.outputs.added }} domains,
            removed ${{ steps.check.outputs.removed }}.
            Generated by .github/workflows/refresh-phishing.yml
          title: 'Auto: refresh phishing-domain list'
          body: |
            ### Daily automated refresh

            Sources:
            - **PhishStats** free CSV feed (score ≥ 6)
            - **OpenPhish** free feed
            - **URLhaus** by abuse.ch

            ### Delta

            | | Count |
            |---|---|
            | Added | ${{ steps.check.outputs.added }} |
            | Removed | ${{ steps.check.outputs.removed }} |

            Generated by `.github/workflows/refresh-phishing.yml`.
            Merging this PR updates the file in main; you'll need to run
            `npx wrangler@latest deploy` (or `pnpm release`) afterwards to push
            the new list to `verify.agentpki.dev`.

            To regenerate locally: `pnpm refresh-phishing`.
            To inspect without writing: `pnpm refresh-phishing:dry`.
          labels: |
            phishing-list
            automated

      - name: No changes
        if: steps.check.outputs.changed == 'false'
        run: echo "No change in phishing list this run."
